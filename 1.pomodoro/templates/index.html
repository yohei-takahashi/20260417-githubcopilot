<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <!-- ヘッダーバー -->
        <header class="header">
            <h1 class="header-title">ポモドーロタイマー</h1>
            <div class="window-icons" aria-hidden="true">
                <span>ー</span><span>□</span><span>×</span>
            </div>
        </header>

        <!-- 状態ラベル -->
        <p id="status-label" class="status-label">作業中</p>

        <!-- 円形プログレスバー -->
        <div class="timer-circle">
            <svg width="200" height="200" viewBox="0 0 200 200">
                <circle class="progress-bg" cx="100" cy="100" r="90"
                        stroke="#e0e0e0" stroke-width="8" fill="none" />
                <circle id="progress-ring" class="progress-ring" cx="100" cy="100" r="90"
                        stroke="#7c3aed" stroke-width="8" fill="none"
                        stroke-dasharray="565.48" stroke-dashoffset="0"
                        stroke-linecap="round"
                        transform="rotate(-90 100 100)" />
            </svg>
            <span id="time-display" class="time-display">25:00</span>
        </div>

        <!-- 操作ボタン -->
        <div class="buttons">
            <button id="toggle-btn" class="btn btn-primary">開始</button>
            <button id="reset-btn" class="btn btn-secondary">リセット</button>
        </div>

        <!-- 進捗カード -->
        <div class="progress-cards">
            <div class="card">
                <p class="card-label">完了数</p>
                <p id="completed-count" class="card-value">0</p>
            </div>
            <div class="card">
                <p class="card-label">集中時間</p>
                <p id="total-focus" class="card-value">0分</p>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/timerCore.js') }}"></script>
    <script src="{{ url_for('static', filename='js/storage.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
